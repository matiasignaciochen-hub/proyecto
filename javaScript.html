<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Estructuras de control en JavaScript</title>
</head>
<body>

    <h1>Estructura de Control en Js</h1>
    
    <p id="resultado1"></p>
    <p id="resultado2"></p>

    <hr>

    <h2>Estructuras Condicionales</h2>
    <button id="demo1">1. Probar if (Edad)</button>
    <button id="demo2">2. Probar if...else (Acceso)</button>
    <button id="demo3">3. Probar if...else if...else (Calificación)</button>

    <script>
        let valor1 = prompt('Ingrese el primer número:');
        let valor2 = prompt('Ingrese el segundo número:');

        let res1 = document.getElementById("resultado1");
        let res2 = document.getElementById("resultado2");

        let suma = parseInt(valor1) + parseInt(valor2);
        let producto = parseInt(valor1) * parseInt(valor2);

        res1.innerHTML = 'La suma es: ' + suma;
        res2.innerHTML = 'El producto es: ' + producto;


        let boton1 = document.getElementById("demo1");
        boton1.addEventListener("click", function() {
            let edad = prompt('Ingrese la edad:');
            if (edad >= 18) {
                alert("Puedes ingresar a esta sección");
            }
        });


        let boton2 = document.getElementById("demo2");
        boton2.addEventListener("click", function() {
            let edad = prompt('Ingrese la edad:');
            if (edad >= 18) {
                alert("Puedes ingresar a esta sección");
            } else {
                alert("NO Puedes ingresar a esta sección");
            }
        });


       
    let boton3 = document.getElementById("demo3");
        boton3.addEventListener("click", function() {
            let nota = prompt('Ingrese la calificación:');
            if (nota >= 9) {
                alert("Excelente");
            } else if (nota >= 6) {
                alert("Aprobado");
            } else {
                alert("Debes recuperar");
            }
        });
    </script>

</body>
</html>
